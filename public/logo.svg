>

<!-- Goal O with checkmark -->
<circle cx="60" cy="40" r="20" stroke="#10B981" stroke-width="3"/>
<polyline points="50,40 58,48 70,30" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

<!-- Text: G -->
<text x="20" y="47" font-family="Segoe UI, sans-serif" font-size="32" fill="#FFFFFF" font-weight="600">
    G
</text>

<!-- Text: al -->
<text x="85" y="47" font-family="Segoe UI, sans-serif" font-size="32" fill="#FFFFFF" font-weight="600">
    al
</text>

<!-- AI Highlight -->
<text x="140" y="47" font-family="Segoe UI, sans-serif" font-size="32" fill="#9810fa" font-weight="700">
